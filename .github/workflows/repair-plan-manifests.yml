name: Correct archived plan source references
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: plan-manifest-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11.9'
      - name: Correct metadata and verify every replacement
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHARD_COUNT: '4'
          SHARD_INDEX: ${{ matrix.shard }}
        run: node repair-release-worker.mjs
